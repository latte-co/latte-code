<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Claude Code-inspired single-session TUI prototypes for Latte Code."
    />
    <title>Latte Code · Single-session TUI prototypes</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="review-bar">
      <div>
        <p class="eyebrow">LATTE CODE · STATIC UI PROTOTYPE</p>
        <h1>Single-session conversation flow</h1>
      </div>
      <nav class="state-switcher" aria-label="Prototype state">
        <button type="button" data-state="idle"><kbd>1</kbd> 空状态</button>
        <button type="button" data-state="working"><kbd>2</kbd> 执行中</button>
        <button type="button" data-state="permission"><kbd>3</kbd> 权限确认</button>
        <button type="button" data-state="complete"><kbd>4</kbd> 完成态</button>
        <button type="button" data-state="todo"><kbd>5</kbd> Todo</button>
        <button type="button" data-state="subagent"><kbd>6</kbd> Subagents</button>
        <button type="button" data-state="team"><kbd>7</kbd> Agent Team</button>
        <button type="button" data-state="agents"><kbd>8</kbd> Agents</button>
      </nav>
    </header>

    <main class="prototype-stage">
      <section class="terminal" aria-label="Latte Code terminal prototype">
        <div class="terminal-chrome" aria-hidden="true">
          <span class="traffic-light traffic-light--red"></span>
          <span class="traffic-light traffic-light--yellow"></span>
          <span class="traffic-light traffic-light--green"></span>
          <span class="terminal-title">latte-code</span>
        </div>
        <div id="prototype-screen" class="terminal-screen" aria-live="polite"></div>
      </section>
    </main>

    <footer class="review-footer">
      <span id="state-caption">执行中 · 主流程与工具活动</span>
      <span>原型控制不属于最终 TUI · 数字键 1–8 切换</span>
    </footer>

    <template id="state-idle">
      <div class="tui tui--idle">
        <header class="tui-header tui-header--welcome">
          <div class="brand-lockup">
            <div class="latte-mark" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
            <div>
              <div class="brand-line">
                <strong>Latte Code</strong>
                <span>v0.1.0</span>
              </div>
            </div>
          </div>
          <dl class="environment-card">
            <div><dt>model:</dt><dd>gpt-5.6 · xhigh</dd></div>
            <div><dt>directory:</dt><dd>~/projects/latte-code</dd></div>
            <div><dt>permissions:</dt><dd class="tone-amber">Ask mode</dd></div>
          </dl>
        </header>

        <section class="welcome-content">
          <p class="tip"><strong>Tip:</strong> Describe an outcome. Latte Code will inspect, edit, and verify the repository.</p>
        </section>

        <footer class="composer composer--welcome">
          <div class="composer-input">
            <span class="prompt-glyph">›</span>
            <span class="fake-caret" aria-hidden="true"></span>
            <span class="placeholder">Ask Latte Code to change this repository…</span>
          </div>
          <div class="composer-meta">
            <span><strong>Build</strong> · gpt-5.6 · xhigh · Ask</span>
            <span><kbd>Ctrl+Enter</kbd> send · <kbd>Ctrl+P</kbd> commands</span>
          </div>
        </footer>
      </div>
    </template>

    <template id="state-working">
      <div class="tui">
        <header class="tui-header tui-header--compact">
          <div class="product-context">
            <span class="status-dot status-dot--working"></span>
            <strong>Latte Code</strong>
            <span>v0.1.0</span>
          </div>
          <div class="repository-context">
            <span>~/projects/latte-code</span>
            <span class="branch">main*</span>
          </div>
        </header>

        <div class="transcript">
          <article class="message message--user">
            <span class="message-glyph">›</span>
            <p>修复 TUI 中普通的 q、s、j、k 被快捷键截获的问题，并补充回归测试。</p>
          </article>

          <p class="thinking"><span class="spinner">✦</span> Thought for 9s</p>

          <section class="activity-flow" aria-label="Agent activity">
            <section class="activity-phase activity-phase--complete" data-phase>
              <button class="phase-summary" type="button" aria-expanded="false">
                <span class="phase-marker">✓</span>
                <strong>Inspected input handling</strong>
                <span class="phase-meta">2 actions</span>
                <span class="phase-chevron">›</span>
              </button>
              <div class="phase-detail" hidden>
                <article class="tool-row" data-tool>
                  <button class="tool-summary" type="button" aria-expanded="false">
                    <span class="tool-tree">├─</span>
                    <span class="tool-status tool-status--success">✓</span>
                    <span><strong>Search</strong> <code>reduce_key</code> in <code>crates/latte-tui</code></span>
                    <span class="tool-time">18 matches</span>
                  </button>
                  <div class="tool-detail" hidden>
                    <code>crates/latte-tui/src/thread.rs:263</code>
                    <code>crates/latte-tui/src/thread.rs:361</code>
                  </div>
                </article>

                <article class="tool-row" data-tool>
                  <button class="tool-summary" type="button" aria-expanded="false">
                    <span class="tool-tree">└─</span>
                    <span class="tool-status tool-status--success">✓</span>
                    <span><strong>Read</strong> <code>crates/latte-tui/src/thread.rs</code></span>
                    <span class="tool-time">1,385 lines</span>
                  </button>
                  <div class="tool-detail" hidden>
                    <p>Reducer, renderer, terminal loop, and existing TestBackend coverage.</p>
                  </div>
                </article>
              </div>
            </section>

            <section class="activity-phase activity-phase--complete" data-phase>
              <button class="phase-summary" type="button" aria-expanded="false">
                <span class="phase-marker">✓</span>
                <strong>Applied the fix</strong>
                <span class="phase-meta">1 action · +74 −29</span>
                <span class="phase-chevron">›</span>
              </button>
              <div class="phase-detail" hidden>
                <article class="tool-row" data-tool>
                  <button class="tool-summary" type="button" aria-expanded="false">
                    <span class="tool-tree">└─</span>
                    <span class="tool-status tool-status--success">✓</span>
                    <span><strong>Edit</strong> <code>crates/latte-tui/src/thread.rs</code></span>
                    <span class="tool-time tone-amber">+74 −29</span>
                  </button>
                  <div class="tool-detail tool-detail--diff" hidden>
                    <span class="diff-add">+ Composer owns every printable character</span>
                    <span class="diff-add">+ Esc enters transcript navigation</span>
                    <span class="diff-remove">− Global j/k/q/s shortcuts while composing</span>
                  </div>
                </article>
              </div>
            </section>

            <section class="activity-phase activity-phase--active" data-phase>
              <button class="phase-summary" type="button" aria-expanded="true">
                <span class="phase-marker">●</span>
                <strong>Verifying behavior</strong>
                <span class="phase-meta">running</span>
                <span class="phase-chevron">›</span>
              </button>
              <div class="phase-detail">
                <article class="tool-row" data-tool>
                  <button class="tool-summary" type="button" aria-expanded="true">
                    <span class="tool-tree">└─</span>
                    <span class="tool-status tool-status--running">◌</span>
                    <span><strong>Run</strong> <code>cargo test -p latte-tui</code></span>
                    <span class="tool-time">8.2s</span>
                  </button>
                  <div class="tool-detail">
                    <span class="terminal-output">test composer_accepts_reserved_characters ... ok</span>
                    <span class="terminal-output tone-muted">test paste_preserves_multiline_text ... running</span>
                  </div>
                </article>
              </div>
            </section>
          </section>

        </div>

        <footer class="composer">
          <div class="composer-input composer-input--multiline">
            <span class="prompt-glyph">›</span>
            <span class="composer-draft">顺便检查粘贴多行文本后的光标位置，<br>并确认 Shift+Enter 换行不会触发发送。<span class="fake-caret" aria-hidden="true"></span></span>
          </div>
          <div class="composer-meta">
            <span><strong>Build</strong> · gpt-5.6 · xhigh · Ask</span>
            <span>Working · <kbd>Ctrl+C</kbd> interrupt · <kbd>Ctrl+P</kbd> commands</span>
          </div>
        </footer>
      </div>
    </template>

    <template id="state-todo">
      <div class="tui tui--todo">
        <header class="tui-header tui-header--compact">
          <div class="product-context">
            <span class="status-dot status-dot--working"></span>
            <strong>Latte Code</strong>
            <span>Planning</span>
          </div>
          <div class="repository-context">
            <span>~/projects/latte-code</span>
            <span class="branch">main*</span>
          </div>
        </header>

        <div class="transcript">
          <article class="message message--user">
            <span class="message-glyph">›</span>
            <p>修复提交失败时用户消息消失的问题，补充失败态和真实 PTY 回归测试。</p>
          </article>

          <p class="thinking"><span class="spinner">✦</span> Thought for 7s</p>
        </div>

        <section class="todo-block" data-todo aria-label="Current todo list">
          <button class="todo-summary" type="button" aria-expanded="false">
            <span class="todo-title">Todo</span>
            <span class="todo-current"><span class="todo-current-status">●</span> Persist user message before provider setup</span>
            <span class="todo-progress">1/5 done</span>
            <span class="todo-chevron">›</span>
          </button>

          <ol class="todo-list" hidden>
            <li class="todo-item todo-item--done">
              <span class="todo-status">✓</span>
              <span>Trace the submit and provider initialization path</span>
            </li>
            <li class="todo-item todo-item--active">
              <span class="todo-status">●</span>
              <span><strong>Persist the user message before provider setup</strong><small>Current task</small></span>
            </li>
            <li class="todo-item todo-item--pending">
              <span class="todo-status">○</span>
              <span>Map provider failures into the transcript</span>
            </li>
            <li class="todo-item todo-item--blocked">
              <span class="todo-status">!</span>
              <span>Add real PTY regression coverage<small>Blocked · PTY access unavailable</small></span>
            </li>
            <li class="todo-item todo-item--skipped">
              <span class="todo-status">–</span>
              <span>Retain the legacy composer restore behavior<small>Skipped · superseded by durable failure rendering</small></span>
            </li>
          </ol>
        </section>

        <footer class="composer">
          <div class="composer-input">
            <span class="prompt-glyph">›</span>
            <span class="fake-caret" aria-hidden="true"></span>
            <span class="placeholder">Add guidance while Latte Code works…</span>
          </div>
          <div class="composer-meta">
            <span><strong>Build</strong> · gpt-5.6 · xhigh · Ask</span>
            <span>Working · <kbd>Ctrl+C</kbd> interrupt · <kbd>Ctrl+P</kbd> commands</span>
          </div>
        </footer>
      </div>
    </template>

    <template id="state-subagent">
      <div class="tui tui--subagent">
        <header class="tui-header tui-header--compact">
          <div class="product-context">
            <span class="status-dot status-dot--working"></span>
            <strong>Latte Code</strong>
            <span>Main · 2 subagents active</span>
          </div>
          <div class="repository-context">
            <span>~/projects/latte-code</span>
            <span class="branch">main*</span>
          </div>
        </header>

        <div class="transcript">
          <article class="message message--user">
            <span class="message-glyph">›</span>
            <p>调查提交失败的原因，补充真实 PTY 回归测试，并修复失败投影。</p>
          </article>

          <p class="thinking"><span class="spinner">✦</span> Spawned after 8s</p>
          <p class="assistant-note">我会继续处理失败投影，同时启动两个临时后台任务；它们完成后只把 handoff 返回主 Session。</p>

          <section class="team-delegation" aria-label="Background task delegation">
            <div class="team-event"><span>◆</span><strong>Spawned 2 background tasks</strong><small>Main session</small></div>
            <div class="team-assignment"><span>├─</span><span class="tone-cyan">◈</span><strong>Explore</strong><span>Trace persistence path</span></div>
            <div class="team-assignment"><span>└─</span><span class="tone-cyan">◈</span><strong>Test</strong><span>Reproduce PTY failure</span></div>
          </section>

          <p class="agent-milestone"><span>◆</span> Explore spawned Migration Scout · Search provider-failure fixtures</p>
          <p class="agent-milestone agent-milestone--handoff"><span>✓</span> Migration Scout handoff · Existing fixture lacks a durability assertion.</p>

          <article class="message message--user message--followup">
            <span class="message-glyph">›</span>
            <p>先覆盖当前平台，跨平台 fixture 可以后续再补。</p>
          </article>

          <p class="assistant-note">收到。这条 steering 会由 Main 处理；Test 继续当前平台验证，不需要单独进入它的会话。</p>
        </div>

        <section class="agents-dock" data-agents aria-label="Background subagents">
          <button class="agents-summary" type="button" aria-expanded="false">
            <span class="agents-title">Agents</span>
            <span class="agents-current"><span>◈</span> Explore · <span>◈</span> Test</span>
            <span class="agents-count">3 instances · 2 active</span>
            <span class="agents-chevron">›</span>
          </button>
          <div class="agents-list" hidden>
            <button class="agent-dock-row" type="button" data-open-agent="explore" data-agent-context="lineage"><span class="tone-cyan">◈</span><strong>Explore</strong><span>Trace persistence path</span><small>gpt-5.6 · high</small></button>
            <button class="agent-dock-row agent-dock-row--child" type="button" data-open-agent="scout" data-agent-context="lineage"><span class="tone-green">└✓</span><strong>Scout</strong><span>Search failure fixtures</span><small>gpt-5.6-mini · medium</small></button>
            <button class="agent-dock-row" type="button" data-open-agent="test" data-agent-context="lineage"><span class="tone-cyan">◈</span><strong>Test</strong><span>Reproduce PTY failure</span><small>gpt-5.4-mini · high</small></button>
          </div>
        </section>

        <section class="todo-block" data-todo aria-label="Main session todo list">
          <button class="todo-summary" type="button" aria-expanded="false">
            <span class="todo-title">Todo</span>
            <span class="todo-current"><span class="todo-current-status">●</span> Persist user message <span class="todo-owner">@Main</span></span>
            <span class="todo-progress">1/4 done</span>
            <span class="todo-chevron">›</span>
          </button>

          <ol class="todo-list" hidden>
            <li class="todo-item todo-item--done"><span class="todo-status">✓</span><span>Find provider-failure fixtures <small class="todo-owner">@Scout</small></span></li>
            <li class="todo-item todo-item--active"><span class="todo-status">●</span><span><strong>Trace the persistence path</strong><small class="todo-owner">@Explore</small></span></li>
            <li class="todo-item todo-item--active"><span class="todo-status">●</span><span><strong>Persist the user message</strong><small class="todo-owner">@Main</small></span></li>
            <li class="todo-item todo-item--active"><span class="todo-status">●</span><span><strong>Add real PTY coverage</strong><small class="todo-owner">@Test</small></span></li>
          </ol>
        </section>

        <footer class="composer">
          <div class="composer-input">
            <span class="prompt-glyph">›</span>
            <span class="fake-caret" aria-hidden="true"></span>
            <span class="placeholder">Guide Main while background tasks run…</span>
          </div>
          <div class="composer-meta">
            <span><strong>Build</strong> · gpt-5.6 · xhigh · Ask</span>
            <span>2 subagents active · <kbd>Ctrl+C</kbd> interrupt Main · <kbd>Ctrl+P</kbd> commands</span>
          </div>
        </footer>
      </div>
    </template>

    <template id="state-agent-team">
      <div class="tui tui--team">
        <header class="tui-header tui-header--compact">
          <div class="product-context">
            <span class="status-dot status-dot--working"></span>
            <strong>Latte Code</strong>
            <span>Lead · Team auth-refresh</span>
          </div>
          <div class="repository-context">
            <span>4 members · 2 active</span>
            <span class="branch">main*</span>
          </div>
        </header>

        <div class="transcript">
          <article class="message message--user">
            <span class="message-glyph">›</span>
            <p>修复提交失败时用户消息消失的问题，并覆盖真实 PTY 失败流程。</p>
          </article>

          <p class="thinking"><span class="spinner">✦</span> Team started after 11s</p>
          <p class="assistant-note">我会作为 Lead 处理服务层修复，同时把持久化调查、PTY 回归和边界评审交给团队成员。</p>

          <section class="team-delegation" aria-label="Team delegation">
            <div class="team-event"><span>◆</span><strong>Delegated 3 tasks</strong><small>Team auth-refresh</small></div>
            <div class="team-assignment"><span>├─</span><span class="tone-cyan">◈</span><strong>Explore</strong><span>Trace persistence path</span></div>

            <p>同时确认配置错误不会再把 prompt 塞回输入框。</p>
          </article>

          <p class="assistant-note">收到。这条 steering 已加入 Lead 的当前工作；Test 会继续在后台运行，完成后由我统一汇总。</p>
        </div>

        <section class="agents-dock" data-agents aria-label="Agent team status">
          <button class="agents-summary" type="button" aria-expanded="false">
            <span class="agents-title">Team</span>
            <span class="agents-current"><span>●</span> Lead · <span>◈</span> Test</span>
            <span class="agents-count">4 members · 2 active</span>
            <span class="agents-chevron">›</span>
          </button>
          <div class="agents-list" hidden>
            <button class="agent-dock-row" type="button" data-open-agent="lead" data-agent-context="team"><span class="tone-cyan">●</span><strong>Lead</strong><span>Implement failure projection</span><small>gpt-5.6 · xhigh</small></button>
            <button class="agent-dock-row" type="button" data-open-agent="explore" data-agent-context="team"><span class="tone-green">✓</span><strong>Explore</strong><span>Trace persistence path</span><small>gpt-5.6 · high</small></button>
            <button class="agent-dock-row" type="button" data-open-agent="test" data-agent-context="team"><span class="tone-cyan">◈</span><strong>Test</strong><span>Reproduce PTY failure</span><small>gpt-5.4-mini · high</small></button>
            <button class="agent-dock-row" type="button" data-open-agent="reviewer" data-agent-context="team"><span class="tone-amber">!</span><strong>Reviewer</strong><span>Waiting for implementation</span><small>gpt-5.6 · xhigh</small></button>
          </div>
        </section>

        <section class="todo-block" data-todo aria-label="Current todo list">
          <button class="todo-summary" type="button" aria-expanded="false">
            <span class="todo-title">Todo</span>
            <span class="todo-current"><span class="todo-current-status">●</span> Persist user message <span class="todo-owner">@Lead</span></span>
            <span class="todo-progress">1/4 done</span>
            <span class="todo-chevron">›</span>
          </button>

          <ol class="todo-list" hidden>
            <li class="todo-item todo-item--done">
              <span class="todo-status">✓</span>
              <span>Trace the submit path <small class="todo-owner">@Explore</small></span>
            </li>
            <li class="todo-item todo-item--active">
              <span class="todo-status">●</span>
              <span><strong>Persist the user message</strong><small class="todo-owner">@Lead</small></span>

        </section>

        <footer class="composer">
          <div class="composer-input">
            <span class="prompt-glyph">›</span>
            <button class="composer-target" type="button" data-target-cycle aria-label="Change message target">Lead <span>▾</span></button>
            <span class="fake-caret" aria-hidden="true"></span>
            <span class="placeholder" data-target-placeholder>Message Lead while the team works…</span>

          <div class="composer-meta">
            <span><strong>Build</strong> · gpt-5.6 · xhigh · Ask</span>
            <span>Team 4 · 2 active · <kbd>Ctrl+C</kbd> interrupt Lead · <kbd>Ctrl+P</kbd> commands</span>
          </div>
        </footer>
      </div>
    </template>

    <template id="state-agent-sessions">
      <div class="tui tui--agent-sessions">
        <header class="tui-header tui-header--compact">
          <div class="product-context">
            <span class="status-dot status-dot--working"></span>
            <strong>Subagents</strong>
            <span>Main session lineage</span>
          </div>
          <div class="repository-context">
            <span>3 instances · 2 active</span>
            <span>Esc main</span>
          </div>
        </header>

        <div class="agent-inspector">
          <aside class="agent-session-list" aria-label="Subagent session tree">
            <div class="agent-session-list-title"><strong>Run tree</strong><span>Main + 3</span></div>

            <button class="agent-session-item is-selected" type="button" data-agent-session="main">
              <span class="agent-tree-space"></span><span class="tone-cyan">●</span>
              <span class="agent-session-copy"><span class="agent-session-name"><strong>Main</strong><em>gpt-5.6 · xhigh</em></span><small>Fix failure projection</small></span>
            </button>

            <div class="agent-tree-branch" data-agent-branch>
              <div class="agent-tree-parent-row">
                <button class="agent-tree-toggle" type="button" data-agent-tree-toggle aria-expanded="true" aria-label="Collapse Explore children">›</button>
                <button class="agent-session-item agent-session-item--branch" type="button" data-agent-session="explore">
                  <span class="tone-cyan">◈</span>
                  <span class="agent-session-copy"><span class="agent-session-name"><strong>Explore</strong><em>gpt-5.6 · high</em></span><small>Trace persistence path</small></span>
                </button>
