name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  unit-tests:
    name: UT (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make test-unit

  contract-tests:
    name: Contract (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make test-inventory
      - run: make test-contract

  e2e-tests:
    name: E2E (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make test-e2e

  doc-tests:
    name: Documentation tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make test-doc

  coverage-unit:
    name: Coverage - UT (95%)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: make coverage-unit

  coverage-e2e:
    name: Coverage - E2E (80%)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: make coverage-e2e

  coverage-total:
    name: Coverage - total (90%)
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: make coverage-total

  dependency-audit:
    name: Dependency audit
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  windows-compile:
    name: Windows compile
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Process supervision and safe mutation fail closed at runtime on non-Unix.
      - run: cargo check --workspace --all-targets --all-features

  pr-gate:
    name: PR Gate
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs:
      - static
      - unit-tests
      - contract-tests
      - e2e-tests
      - doc-tests
      - coverage-unit
      - coverage-e2e
      - coverage-total
      - dependency-audit
      - windows-compile
    steps:
      - name: Require every merge gate to succeed
        shell: bash
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          CONTRACT_RESULT: ${{ needs.contract-tests.result }}
          E2E_RESULT: ${{ needs.e2e-tests.result }}
          DOC_RESULT: ${{ needs.doc-tests.result }}
          COVERAGE_UNIT_RESULT: ${{ needs.coverage-unit.result }}
          COVERAGE_E2E_RESULT: ${{ needs.coverage-e2e.result }}
          COVERAGE_TOTAL_RESULT: ${{ needs.coverage-total.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          WINDOWS_COMPILE_RESULT: ${{ needs.windows-compile.result }}
        run: |
          failed=0
          for result_name in \
            STATIC_RESULT \
            UNIT_RESULT \
            CONTRACT_RESULT \
            E2E_RESULT \
            DOC_RESULT \
            COVERAGE_UNIT_RESULT \
            COVERAGE_E2E_RESULT \
            COVERAGE_TOTAL_RESULT \
            DEPENDENCY_AUDIT_RESULT \
            WINDOWS_COMPILE_RESULT
          do
            result="${!result_name}"
            if [[ "$result" != "success" ]]; then
              echo "::error::${result_name} was ${result}; every PR Gate dependency must succeed"
              failed=1
            fi
          done
          exit "$failed"

  release-build:
    name: Release build (${{ matrix.os }})
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: latte-code-linux-x86_64
            binary: target/release/latte-code
          - os: macos-latest
            artifact: latte-code-macos-arm64
            binary: target/release/latte-code
          - os: windows-latest
            artifact: latte-code-windows-x86_64
            binary: target/release/latte-code.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p latte-code
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
